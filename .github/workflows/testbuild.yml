name: Test-Build
on:
  push:
    branches:
      - main
jobs:
  for-hosted:
    strategy:
      fail-fast: false
      matrix:
        os:
        - 'macos-14'
        - 'macos-latest'
        - 'ubuntu-22.04'
        - 'ubuntu-26.04'
        - 'ubuntu-latest'
        - 'ubuntu-24.04-arm'
        - 'ubuntu-26.04-arm'
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "event=${{ github.event_name }} runner=${{ runner.os }} branch=${{ github.ref }} repo=${{ github.repository }} index=${{ strategy.job-index}} os=${{ matrix.os }} node=${{ matrix.node }} ."
      - uses: actions/checkout@v7
      - run: SUDO=sudo ./testbuild.sh --preinstall
      - run: echo "status=${{ job.status }}."
      - uses: actions/upload-artifact@v7
        with:
          name: DIST-hosted-${{ strategy.job-index }}-${{ matrix.os }}
          path: DIST/*
  for-containers:
    strategy:
      fail-fast: false
      matrix:
        os:
        - 'debian:8'
        - 'debian:9'
        - 'debian:11'
        - 'debian:13'
        - 'debian:testing'
        - 'alpine:3.9'
        - 'alpine:latest'
        - 'centos:7'
        - 'rockylinux/rockylinux:8'
        - 'rockylinux/rockylinux:10'
        - 'fedora:30'
        - 'fedora:44'
        - 'archlinux:latest'
        - 'gentoo/stage3:latest'
    runs-on: ubuntu-latest
    env:
      CONTAINER: ${{ matrix.os }}
    steps:
      - run: |
        echo "event=${{ github.event_name }} runner=${{ runner.os }} branch=${{ github.ref }} repo=${{ github.repository }} index=${{ strategy.job-index}} os=${{ matrix.os }} node=${{ matrix.node }} ."
        MATRIXOS="${{ matrix.os }}"
        MATRIXOS="${MATRIXOS//\//_}"
        MATRIXOS="${MATRIXOS//://_}"
        echo "MATRIXOS=$MATRIXOS" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
      - run: docker pull $CONTAINER
      - run: docker run --name container-"${CONTAINER//[:\/]/.}" -v "${{ github.workspace }}:/workspace" -w /workspace $CONTAINER ./testbuild.sh --preinstall
      - run: echo "status=${{ job.status }}."
      - uses: actions/upload-artifact@v7
        with:
          name: DIST-container-${{ strategy.job-index }}-${{ env.MATRIXOS }}
          path: DIST
